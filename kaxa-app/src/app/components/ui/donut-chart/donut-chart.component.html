<div class="donut-wrap">
  <div class="donut" [style.background]="gradient()">
    <div class="donut-hole">
      <span class="donut-total">{{ total() }}</span>
      <span class="donut-label">Productos</span>
    </div>
  </div>
  <div class="legend">
    @for (s of segments; track s.label; let i = $index) {
      <div class="legend-item">
        <span class="dot" [style.background]="colorOf(i)"></span>
        <span class="legend-label">{{ s.label }}</span>
        <span class="legend-value">{{ s.value }}</span>
      </div>
    } @empty {
      <span class="legend-empty">Sin categorías todavía</span>
    }
  </div>
</div>
